<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <!-- V letterform with pulse -->
  <g filter="url(#glow)">
    <!-- Left stroke of V -->
    <path d="M140 140 L256 380" stroke="url(#pulse)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <!-- Right stroke of V -->
    <path d="M372 140 L256 380" stroke="url(#pulse)" stroke-width="28" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Heartbeat pulse through the V -->
  <path d="M120 280 L190 280 L215 230 L240 320 L265 250 L285 295 L310 280 L392 280"
        stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small cross accent -->
  <g transform="translate(400, 120)" opacity="0.4">
    <rect x="-4" y="-16" width="8" height="32" rx="3" fill="#c4b5fd"/>
    <rect x="-16" y="-4" width="32" height="8" rx="3" fill="#c4b5fd"/>
  </g>
  <!-- MED text -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="12" fill="#c4b5fd" opacity="0.7">MED</text>
</svg>